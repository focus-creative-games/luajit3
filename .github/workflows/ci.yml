name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLJ3_ENABLE_ASAN=ON -DLJ3_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: PUC Lua 5.3.4 basic suite
        continue-on-error: true
        run: |
          chmod +x scripts/run_puc_tests.sh
          scripts/run_puc_tests.sh || true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: PUC Lua 5.3.4 basic suite
        continue-on-error: true
        shell: pwsh
        run: |
          try { ./scripts/run_puc_tests.ps1 } catch { Write-Host $_; exit 0 }
